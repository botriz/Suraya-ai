<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnaEmeliyyat-Supercore | مرکز عملیات روزانه سورَیَا</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
:root{--bg:#060a12;--card:#0c1220;--border:#1a2332;--primary:#8b5cf6;--primary-hover:#7c3aed;--text:#e2e8f0;--muted:#94a3b8;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.container{max-width:1300px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
header h1{font-size:1.45rem;font-weight:700;background:linear-gradient(135deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{background:var(--primary);color:#fff;padding:4px 12px;border-radius:20px;font-size:0.75rem}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:1100px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card h2{font-size:1rem;margin-bottom:12px;display:flex;align-items:center;gap:7px}
label{display:block;font-size:0.8rem;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;background:#080d18;border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-family:inherit;font-size:0.88rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
button{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-family:inherit;font-size:0.88rem;font-weight:500;cursor:pointer;transition:0.2s}
button:hover{background:var(--primary-hover)}
button.secondary{background:#1a2332;border:1px solid var(--border)}
button.success{background:var(--success)}
button.danger{background:var(--danger)}
button.full{width:100%;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
@media(max-width:800px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:#080d18;border-radius:8px;padding:12px;text-align:center}
.stat .num{font-size:1.25rem;font-weight:700;color:var(--primary)}
.stat .label{font-size:0.7rem;color:var(--muted);margin-top:2px}
.list{max-height:260px;overflow-y:auto}
