name: Suraya public services CI

on:
  push:
    branches:
      - main
      - "feature/suraya-public-tools-v1"
      - "feature/world-core-api-v1"
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: node --check public/world/world.js
      - name: Verify digital world pages
        run: |
          test -s public/world/index.html
          test -s public/world/visitors.html
          test -s public/world/creators.html
          test -s public/world/businesses.html
          test -s public/world/developers.html
          test -s public/world/world.css
          grep -q 'cookieBanner' public/world/index.html

      - run: node --check world/world-api.js
      - name: Verify digital world API and migration
        run: |
          test -s world/world-api.js
          test -s migrations/001_world_foundation.sql
          grep -q 'world_regions' migrations/001_world_foundation.sql
          grep -q 'world_events' migrations/001_world_foundation.sql
          grep -q 'api/world/v1' server.js
          grep -q 'autonomousActions: false' world/world-api.js
