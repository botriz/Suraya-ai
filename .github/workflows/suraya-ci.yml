name: Suraya public services CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: suraya-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: suraya
          POSTGRES_PASSWORD: suraya_ci_password
          POSTGRES_DB: suraya_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suraya -d suraya_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://suraya:suraya_ci_password@localhost:5432/suraya_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and unit tests
        run: npm run check
      - name: Verify digital world frontend
        run: |
          node --check public/world/world.js
          test -s public/world/index.html
          test -s public/world/visitors.html
          test -s public/world/creators.html
          test -s public/world/businesses.html
          test -s public/world/developers.html
          test -s public/world/world.css
          grep -q 'cookieBanner' public/world/index.html
      - name: Verify API and database migration assets
        run: |
          node --check world/world-api.js
          test -s migrations/001_world_foundation.sql
          test -s migrations/002_revenue_operations.sql
          test -s migrations/004_autonomous_agent.sql
          grep -q 'world_regions' migrations/001_world_foundation.sql
          grep -q 'world_events' migrations/001_world_foundation.sql
          grep -q 'suraya_order_events' migrations/002_revenue_operations.sql
          grep -q 'suraya_agent_tasks' migrations/004_autonomous_agent.sql
          grep -q 'api/world/v1' server.js
          grep -q 'autonomousActions: false' world/world-api.js

      - name: Build deployment container
        run: docker build -t suraya-public-services:ci .

      - name: Validate actual VPS Compose topology
        env:
          POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SURAYA_OPERATOR_TOKEN: ci-only-token
          APP_PORT: 10000
        run: |
          docker compose config --format json > /tmp/suraya-compose.json
          node -e '
            const c = require("/tmp/suraya-compose.json");
            const fail = message => { console.error(message); process.exit(1); };
            if (!c.services?.app || !c.services?.db) fail("Compose must define app and db services");
            if (c.services.chain) fail("Legacy chain service must not be exposed by the VPS stack");
            if (c.services.app.depends_on?.db?.condition !== "service_healthy") fail("App must wait for healthy PostgreSQL");
            if (!c.services.app.ports?.some(p => p.host_ip === "127.0.0.1" && String(p.published) === "10000")) fail("App port must bind to loopback only");
            if (c.services.app.read_only !== true) fail("App container must use a read-only root filesystem");
            if (!c.volumes?.suraya_pgdata) fail("Persistent PostgreSQL volume is required");
            if (c.services.app.environment?.SURAYA_AGENT_ENABLED !== "false") fail("Autonomous agent must remain disabled");
            console.log("VPS Compose topology verified");
          '
