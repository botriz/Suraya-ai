name: Suraya public services CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: suraya-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: suraya
          POSTGRES_PASSWORD: suraya_ci_password
          POSTGRES_DB: suraya_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suraya -d suraya_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://suraya:suraya_ci_password@localhost:5432/suraya_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and unit tests
        run: npm run check
      - name: Verify digital world frontend
        run: |
          node --check public/world/world.js
          test -s public/world/index.html
          test -s public/world/visitors.html
          test -s public/world/creators.html
          test -s public/world/businesses.html
          test -s public/world/developers.html
          test -s public/world/world.css
          grep -q 'cookieBanner' public/world/index.html
      - name: Verify API and database migration assets
        run: |
          node --check world/world-api.js
          test -s migrations/001_world_foundation.sql
          test -s migrations/002_revenue_operations.sql
          grep -q 'world_regions' migrations/001_world_foundation.sql
          grep -q 'world_events' migrations/001_world_foundation.sql
          grep -q 'suraya_order_events' migrations/002_revenue_operations.sql
          grep -q 'api/world/v1' server.js
          grep -q 'autonomousActions: false' world/world-api.js
