<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>عملیات سفارش‌های ثریا</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141d32;--line:#2b3956;--text:#f5f6ff;--muted:#aab5ca;--accent:#8b7cff;--ok:#69d8bb;--bad:#ff9b9b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Vazirmatn,system-ui;line-height:1.8}.wrap{width:min(1100px,94%);margin:28px auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel,.order{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}.muted{color:var(--muted)}label{display:block;margin:8px 0 4px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#0a1121;color:var(--text);font:inherit}button{background:var(--accent);border:0;color:white;padding:10px 16px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:transparent;border:1px solid var(--line)}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.order h3{margin:0}.tag{display:inline-block;background:#8b7cff22;color:#c9c1ff;padding:2px 9px;border-radius:30px;font-size:12px}.msg{min-height:1.5em;color:var(--ok)}.error{color:var(--bad)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{margin:14px auto}}
</style></head>
<body><main class="wrap">
<header class="head"><div><h1>عملیات سفارش‌های ثریا</h1><p class="muted">پنل خصوصی اپراتور · مدیریت درخواست، پیشنهاد قیمت و تحویل</p></div><a href="/" class="muted">بازگشت به سایت</a></header>
<section class="panel" id="login">
<h2>ورود اپراتور</h2><p class="muted">توکن مدیریتی فقط در این مرورگر و تا پایان نشست نگهداری می‌شود. این صفحه عمومی است اما بدون توکن هیچ داده‌ای نمایش نمی‌دهد.</p>
<label for="token">توکن دسترسی</label><input id="token" type="password" autocomplete="current-password" placeholder="SURAYA_OPERATOR_TOKEN">
<div class="actions"><button id="connect">اتصال امن</button></div><p id="loginMsg" class="msg" role="status"></p>
</section>
<section id="workspace" hidden>
<div class="panel"><div class="row"><div><label for="filter">فیلتر وضعیت</label><select id="filter"><option value="">همه سفارش‌ها</option><option>pending</option><option>quoted</option><option>accepted</option><option>in_progress</option><option>delivered</option><option>cancelled</option></select></div><div class="actions" style="align-items:end"><button id="refresh">به‌روزرسانی</button><button class="secondary" id="logout">خروج</button></div></div><p id="count" class="muted"></p></div>
<div id="orders" class="orders"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem("suraya_operator_token")||"";
$("token").value=token;
function message(text,error=false){$("loginMsg").textContent=text;$("loginMsg").className=error?"msg error":"msg"}
async function api(url,options={}){const response=await fetch(url,{...options,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,...options.headers}});const data=await response.json();if(!response.ok)throw new Error(data.error||"خطای ارتباط");return data}
async function load(){try{const data=await api("/api/operator/v1/orders?status="+encodeURIComponent($("filter").value));$("workspace").hidden=false;$("login").hidden=true;$("count").textContent=data.orders.length+" سفارش";$("orders").replaceChildren();for(const order of data.orders){const card=document.createElement("article");card.className="order";const title=document.createElement("h3");title.textContent=order.service_title;const id=document.createElement("p");id.className="muted";id.textContent=order.public_id+" · "+new Date(order.created_at).toLocaleString("fa-IR");const customer=document.createElement("p");customer.textContent=order.customer_name+" · "+(order.customer_email||"بدون ایمیل");const details=document.createElement("p");details.textContent=order.details||"بدون توضیحات";const status=document.createElement("span");status.className="tag";status.textContent=order.status;const form=document.createElement("div");form.innerHTML='<label>وضعیت</label><select class="status"><option>pending</option><option>quoted</option><option>accepted</option><option>in_progress</option><option>delivered</option><option>cancelled</option></select><label>قیمت پیشنهادی</label><input class="amount" type="number" min="0.01" step="0.01" placeholder="مبلغ" /><label>واحد پول</label><select class="currency"><option>USD</option><option>IRR</option><option>IRT</option><option>EUR</option></select><label>یادداشت داخلی</label><textarea class="note" rows="2" maxlength="2000"></textarea><button class="save">ذخیره تغییرات</button>';form.querySelector(".status").value=order.status;form.querySelector(".amount").value=order.quoted_amount||"";form.querySelector(".currency").value=order.quoted_currency||"USD";form.querySelector(".note").value=order.operator_note||"";form.querySelector(".save").addEventListener("click",async()=>{const button=form.querySelector(".save");button.disabled=true;try{await api("/api/operator/v1/orders/"+encodeURIComponent(order.public_id),{method:"PATCH",body:JSON.stringify({status:form.querySelector(".status").value,quotedAmount:form.querySelector(".amount").value||null,quotedCurrency:form.querySelector(".currency").value,operatorNote:form.querySelector(".note").value})});button.textContent="ذخیره شد";}catch(e){alert(e.message)}finally{button.disabled=false}});card.append(title,id,customer,details,status,form);$("orders").append(card)}}catch(e){$("workspace").hidden=true;$("login").hidden=false;message(e.message,true)}}
$("connect").addEventListener("click",async()=>{token=$("token").value.trim();if(!token)return message("توکن را وارد کنید.",true);sessionStorage.setItem("suraya_operator_token",token);message("در حال بررسی دسترسی…");await load()});
$("refresh").addEventListener("click",load);$("filter").addEventListener("change",load);$("logout").addEventListener("click",()=>{sessionStorage.removeItem("suraya_operator_token");token="";$("token").value="";$("workspace").hidden=true;$("login").hidden=false;message("از پنل خارج شدید.")});
if(token)load();
</script></body></html>
