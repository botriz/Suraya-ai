<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ثریا — مرکز محتوای هوش مصنوعی</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #0d0d0d;
            color: #fff;
        }
        header {
            background: #111;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: #fff;
            margin-left: 20px;
            text-decoration: none;
            font-size: 15px;
        }
        .hero {
            text-align: center;
            padding: 120px 20px;
        }
        .hero h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 20px;
            opacity: 0.8;
        }
        .cta {
            margin-top: 30px;
            padding: 12px 30px;
            background: #ff0077;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
        }
        .services {
            padding: 60px 20px;
            text-align: center;
        }
        .services h2 {
            font-size: 32px;
            margin-bottom: 40px;
        }
        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .card {
            background: #1a1a1a;
            padding: 25px;
            width: 280px;
            border-radius: 10px;
            text-align: center;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #111;
            margin-top: 40px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<header>
    <div>ثریا</div>
    <nav>
        <a href="#">خانه</a>
        <a href="#">درباره</a>
        <a href="#">سرویس‌ها</a>
        <a href="#">تماس</a>
        <a href="#">بلاگ</a>
    </nav>
</header>

<section class="hero">
    <h1>مرکز محتوای هوش مصنوعی ثریا</h1>
    <p>پلتفرم هوش مصنوعی شما 🚀</p>
    <a class="cta" href="#">شروع کنید</a>
</section>

<section class="services">
    <h2>سرویس‌های ثریا</h2>
    <div class="cards">
        <div class="card">تولید محتوا با هوش مصنوعی</div>
        <div class="card">تحلیل داده و پردازش متن</div>
        <div class="card">ساخت مدل‌های سفارشی</div>
    </div>
</section>

<footer>
    © 2026 ثریا — همهٔ حقوق محفوظ است.
</footer>

</body>
</html>
